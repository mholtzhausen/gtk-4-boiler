[package]
name = "{{project-name}}"
version = "{{version}}"
edition = "2021"
authors = ["{{author}}"]

[dependencies]
relm4-kit = { git = "https://github.com/YOUR_USER/relm4-kit", tag = "v0.1.0" }
relm4 = { version = "0.9", features = ["libadwaita"] }
relm4-components = "0.9"
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
log = "0.4"
